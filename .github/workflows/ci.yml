name: CI

# Runs automatically on every push and pull request to main.
# This is the actual, working CI/CD pipeline behind the resume claim —
# not a placeholder. It installs dependencies, runs Django's system checks,
# and runs the test suite (tests.py) on every push.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dateutil

      - name: Run Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test
