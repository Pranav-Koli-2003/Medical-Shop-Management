{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'Css/Shop/Sell_medicine.css' %}">
    <title>Sell Medicine</title>
</head>
<body>

    {% include 'Shop/Nbar.html' %}

    <div class="AddMedicine">
        <table>
            <tbody>
                <tr>
                    
                    <th class="thedit" style="width: 420px; ">
                        <label for="medicine">Medicine Name</label>
                    </th>
                    <th class="thedit" style="width: 120px;">
                        <label for="quantity"> Total Quantity</label>
                    </th>
                    <th class="thedit" style="width: 120px;">
                        <label for="MFG"> MFG</label>
                    </th>
                    <th class="thedit" style="width: 120px;">
                        <label for="expiry"> Expiry</label>
                    </th>
                    <th class="thedit" style="width: 120px;">
                        <label for="Sell quantity"> Sell quantity</label>
                    </th>
                    <th class="thedit" style="width: 120px;">
                        <label for="Sell Amount"> Sell Amount</label>
                    </th>
                    <th style="width: 160px; "></th>
                </tr>
                <tr>
                    <td><input type="text" style="color: red; border-bottom: 2px solid red;" class="inputdata" id="getmedicine" name="medicine"></td>
                    <td><input type="text" class="inputdata" id="getquantity" name="quantity" readonly ></td>
                    <td><input type="text" class="inputdata" id="getMFG" name="MFG" readonly></td>
                    <td><input type="text" class="inputdata" id="getexpiry" name="expiry" readonly></td>
                    <td><input type="text" style="color: red; border-bottom: 2px solid red;" class="inputdata" id="getSell_quantity" name="Sell_quantity"></td>
                    <td><input type="text" class="inputdata" id="getSell_Amount" name="Sell_Amount" readonly></td>
                    <td><button type="button" id="addmdata" onclick="AddMedicine()">Add </button></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <div class="frl">
                        <button type="submit" style="width: 100px;" id="outputep" ></button>
                        <button type="submit" style="width: 280px;" id="output" onclick="AddData()"></button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <script>
            const medicines = [];
            
            // Populate the array from Django data
            {% for medicine in sell %}
            medicines.push({
                id: "{{ medicine.id|escapejs }}",
                name: "{{ medicine.purchase_medicine_Name|escapejs }}",
                quantity: "{{ medicine.purchase_medicine_QTY|escapejs }}",
                rate: "{{ medicine.purchase_medicine_M_R_P|escapejs }}",
                MFG: "{{ medicine.purchase_medicine_MFG|escapejs }}",
                expiry: "{{ medicine.purchase_medicine_Expiry|escapejs }}"
            });
            {% endfor %}

            console.log(medicines)
        

        </script>
        <script src="{% static 'JavaScript/Sell_Medicine.js' %}">

        </script>
        

       
    </div>




    
    <div class="DisplayMedicine">
        <form method="POST" action="sell_medicin_all_process">
            {% csrf_token %}
            <table id="drpdata">
                <tr>
                    <th  style="width: 80px;" id="drp">
                        DR Name :
                    </th>
                    <th style="width: 200px;" id="drp">
                        <input type="text" class="newdata" name="DrName" placeholder="Dr.">
                    </th>
                    <th  style="width: 100px;" id="drp">
                        Patient Name :
                    </th>
                    <th  style="width: 200px;" id="drp">
                        <input type="text" class="newdata" name="PatientName" placeholder="....">
                    </th>
                </tr>
            </table>
         <table id="MedicineTable">
            <tbody>
                <tr>
                    <th class="theditno" style="width: 40px;">
                        
                   </th>
                
                    <th class="thedit" style="width: 40px;">
                        No.
                   </th>
                    <th class="thedit" style="width: 400px;">
                        <label for="medicine">Medicine Name</label>
                    </th>
                    
                    <th class="thedit" style="width: 160px;">
                        <label for="Sell quantity"> Sell quantity</label>
                    </th>
                    
                    <th class="thedit" style="width: 160px;">
                        <label for="Sell Amount"> Sell Amount</label>
                    </th>
                    
                </tr>
               <!-- <tr>
                    <td><input type="text" class="inputdata" id="medicine" name="medicine"></td>
                    <td><input type="text" class="inputdata" id="Sell_quantity" name="Sell_quantity"></td>
                    <td><input type="text" class="inputdata" id="Sell_Amount" name="Sell_Amount"></td>
                    <td><button type="button" onclick="deleteRow(this)">Delete</button></td>
                </tr> -->
            </tbody>
        </table>
        <table>
            <tr>
                <th class="theditno" style="width: 40px;"></th>
                <th class="thedit" style="width: 440px;"></th>
                
                <th class="thedit" style="width: 160px;">
                    <label for="total_a">Total Amount</label>
                </th>
                <th class="thedit" style="width: 160px;">
                    <input type="text" name="total_amount_bill" class="inputdata" style="border: 2px solid red;" id="total_amount_display" >
                   
                </th>
            </tr>
        </table>
        <button id="submitdata"  type="submit">Sell Medicine</button>
    </form>

    </div>
    
</body>
</html>
